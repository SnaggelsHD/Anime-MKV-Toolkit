services:
  anime-mkv-toolkit:
    image: ghcr.io/snaggelshd/anime-mkv-toolkit:latest
    container_name: anime-mkv-toolkit
    ports:
      - "8077:8000"
    volumes:
      - ./data:/data
      - /path/to/your/libraries:/libraries
    environment:
      - DB_PATH=/data/chapters.db
      - LIBRARIES_ROOT=/libraries
    restart: unless-stopped
