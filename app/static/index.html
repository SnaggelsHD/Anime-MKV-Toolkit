<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MKV Chapter & Media Info Backup</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>MKV Chapter & Media Info Backup</h1>
    <span id="status-line"></span>
    <label class="theme-switch" title="Toggle dark mode">
      <input type="checkbox" id="theme-toggle">
      <span class="slider"></span>
    </label>
  </header>
  <main>
    <section class="panel">
      <h2>Libraries</h2>
      <div id="library-list">Loading...</div>
    </section>
    <section class="panel" id="show-detail">
      <p id="show-detail-placeholder">Select a library to see its shows.</p>
    </section>
  </main>
  <div id="modal-root"></div>
  <script src="/app.js"></script>
</body>
</html>
