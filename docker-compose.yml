services:
  mkv-chapter-backup:
    build: .
    container_name: mkv-chapter-backup
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - /path/to/your/libraries:/libraries
    environment:
      - DB_PATH=/data/chapters.db
      - LIBRARIES_ROOT=/libraries
    restart: unless-stopped
